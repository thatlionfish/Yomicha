# Baut die Web-Version und veröffentlicht sie auf GitHub Pages:
# https://thatlionfish.github.io/Yomicha/
#
# Einmalig in den Repository-Einstellungen: Settings > Pages >
# „Build and deployment“ > Source: „GitHub Actions“

name: Web-Version veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Web-Version bauen
        run: flutter build web --release --base-href "/Yomicha/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
